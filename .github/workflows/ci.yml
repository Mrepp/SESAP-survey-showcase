name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        package:
          - packages/shared
          - workers/admin
          - workers/processing
          - workers/indexing
          - workers/showcase
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.package }} test
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        worker: [admin, processing, indexing, showcase]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler.toml from template
        working-directory: workers/${{ matrix.worker }}
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's|ENVIRONMENT = "development"|ENVIRONMENT = "production"|g' wrangler.toml
          sed -i 's|<YOUR_R2_BUCKET_NAME>|ci-placeholder-bucket|g' wrangler.toml
          sed -i 's|<YOUR_KV_NAMESPACE_ID>|00000000000000000000000000000000|g' wrangler.toml
          sed -i 's|<YOUR_KV_PREVIEW_ID>|00000000000000000000000000000001|g' wrangler.toml
      - run: pnpm --filter sesap-${{ matrix.worker }} build
