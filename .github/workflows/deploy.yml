name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy-processing:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler.toml from template
        working-directory: workers/processing
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's|<YOUR_KV_NAMESPACE_ID>|${{ secrets.KV_NAMESPACE_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_KV_PREVIEW_ID>|${{ secrets.KV_PREVIEW_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_R2_BUCKET_NAME>|${{ secrets.R2_BUCKET_NAME }}|g' wrangler.toml
          sed -i 's|ENVIRONMENT = "development"|ENVIRONMENT = "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"|g' wrangler.toml
      - name: Validate Workers AI budget
        env:
          WORKERS_AI_DAILY_NEURON_BUDGET: ${{ vars.WORKERS_AI_DAILY_NEURON_BUDGET }}
        run: |
          if [ -z "$WORKERS_AI_DAILY_NEURON_BUDGET" ]; then
            echo "WORKERS_AI_DAILY_NEURON_BUDGET environment variable is required"
            exit 1
          fi
          if ! printf '%s' "$WORKERS_AI_DAILY_NEURON_BUDGET" | grep -Eq '^[0-9]+$'; then
            echo "WORKERS_AI_DAILY_NEURON_BUDGET must be a positive integer neuron count"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/processing
          packageManager: pnpm
          command: deploy
      - name: Write Workers AI budget to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          WORKERS_AI_DAILY_NEURON_BUDGET: ${{ vars.WORKERS_AI_DAILY_NEURON_BUDGET }}
        run: |
          pnpm exec wrangler kv key put "ai:neurons:daily:max" "$WORKERS_AI_DAILY_NEURON_BUDGET" --namespace-id "$KV_NAMESPACE_ID"

  deploy-indexing:
    runs-on: ubuntu-latest
    needs: deploy-processing
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler.toml from template
        working-directory: workers/indexing
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's|<YOUR_KV_NAMESPACE_ID>|${{ secrets.KV_NAMESPACE_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_KV_PREVIEW_ID>|${{ secrets.KV_PREVIEW_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_R2_BUCKET_NAME>|${{ secrets.R2_BUCKET_NAME }}|g' wrangler.toml
          sed -i 's|ENVIRONMENT = "development"|ENVIRONMENT = "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"|g' wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/indexing
          packageManager: pnpm
          command: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: deploy-indexing
    strategy:
      matrix:
        worker: [admin, showcase, intake]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler.toml from template
        working-directory: workers/${{ matrix.worker }}
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's|<YOUR_KV_NAMESPACE_ID>|${{ secrets.KV_NAMESPACE_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_KV_PREVIEW_ID>|${{ secrets.KV_PREVIEW_ID }}|g' wrangler.toml
          sed -i 's|<YOUR_R2_BUCKET_NAME>|${{ secrets.R2_BUCKET_NAME }}|g' wrangler.toml
          sed -i 's|ENVIRONMENT = "development"|ENVIRONMENT = "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"|g' wrangler.toml
      - name: Configure intake public variables
        if: matrix.worker == 'intake'
        working-directory: workers/intake
        env:
          INTAKE_URL: ${{ vars.INTAKE_URL }}
          SHOWCASE_URL: ${{ vars.SHOWCASE_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const vars = ["INTAKE_URL", "SHOWCASE_URL", "EMAIL_FROM", "TURNSTILE_SITE_KEY"];
            for (const key of vars) if (!process.env[key]) throw new Error(`${key} is required for intake deployment`);
            let config = fs.readFileSync("wrangler.toml", "utf8");
            for (const key of vars.slice(0, 3)) config = config.replace(`<YOUR_${key}>`, process.env[key]);
            config = config.replace(/^TURNSTILE_SITE_KEY = ""$/m, `TURNSTILE_SITE_KEY = ${JSON.stringify(process.env.TURNSTILE_SITE_KEY)}`);
            fs.writeFileSync("wrangler.toml", config);
          '
      - name: Build admin UI
        if: matrix.worker == 'admin'
        working-directory: workers/admin
        run: pnpm ui:build
      - name: Configure admin public variables
        if: matrix.worker == 'admin'
        working-directory: workers/admin
        env:
          SHOWCASE_URL: ${{ vars.SHOWCASE_URL }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const vars = ["SHOWCASE_URL", "CF_ACCESS_TEAM_DOMAIN", "CF_ACCESS_AUD"];
            for (const key of vars) if (!process.env[key]) throw new Error(`${key} is required for admin deployment`);
            let config = fs.readFileSync("wrangler.toml", "utf8");
            for (const key of vars) config = config.replace(new RegExp(`^${key} = .*`, "m"), `${key} = ${JSON.stringify(process.env[key])}`);
            fs.writeFileSync("wrangler.toml", config);
          '
      - name: Build showcase UI
        if: matrix.worker == 'showcase'
        working-directory: workers/showcase
        run: pnpm build:ui
      - name: Build intake UI
        if: matrix.worker == 'intake'
        working-directory: workers/intake
        run: pnpm build:ui
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/${{ matrix.worker }}
          packageManager: pnpm
          command: deploy

  smoke:
    runs-on: ubuntu-latest
    needs: [deploy-processing, deploy-indexing, deploy]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      INTAKE_URL: ${{ vars.INTAKE_URL }}
      PROCESSING_URL: ${{ vars.PROCESSING_URL }}
      INDEXING_URL: ${{ vars.INDEXING_URL }}
      SHOWCASE_URL: ${{ vars.SHOWCASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Wait for edge propagation
        run: sleep 15
      - run: pnpm test:smoke
