name = "sesap-admin"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Admin must be reachable only through the Cloudflare Access-protected
# hostname. The auth middleware verifies the Access JWT, so a live workers.dev
# hostname is no longer full admin by way of a spoofed header — but it would
# still expose the origin, so it stays off.
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/*"]

[dev]
port = 8887
inspector_port = 9329

[[r2_buckets]]
binding = "SESAP_BUCKET"
bucket_name = "<YOUR_R2_BUCKET_NAME>"

[[kv_namespaces]]
binding = "SESAP_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_KV_PREVIEW_ID>"

[vars]
ENVIRONMENT = "development"
SHOWCASE_URL = "http://localhost:8890"  # Update to production URL when deploying
# Cloudflare Access team domain and application audience (AUD) tag. Both are
# required outside development: the middleware verifies `Cf-Access-Jwt-Assertion`
# against this team's JWKS and checks the token's `aud` against the tag. With
# either unset the worker refuses every request rather than falling back to the
# `Cf-Access-Authenticated-User-Email` header, which any client can set.
#
# Team domain is the bare label, e.g. "acme" for acme.cloudflareaccess.com.
CF_ACCESS_TEAM_DOMAIN = ""
CF_ACCESS_AUD = ""
# Default Kaltura partner id used when an admin pastes a media-page URL that
# doesn't carry the partner id (iframe embeds do). Leave empty to require
# the iframe form.
KALTURA_PARTNER_ID = ""
# Optional Kaltura player UI config used when constructing public embeds from
# a bare entry id or media URL. If omitted, the app uses its default player.
KALTURA_UICONF_ID = ""
# NEXT_DEV_URL is intentionally not set here. It is a local-dev-only variable
# that proxies non-API paths to the next dev server. In production the ASSETS
# binding serves the built next export. Add it to your local (gitignored)
# wrangler.toml if you need the dev proxy.

# Service bindings to other workers
[[services]]
binding = "PROCESSING_WORKER"
service = "sesap-processing"

[[services]]
binding = "INDEXING_WORKER"
service = "sesap-indexing"

# Queue producer for interview processing
[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "interview-processing"

# Best-effort contributor status emails for moderated self-service submissions.
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "interview-notifications"
