name = "sesap-admin"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/*"]

[dev]
port = 8787
inspector_port = 9229

[[r2_buckets]]
binding = "SESAP_BUCKET"
bucket_name = "<YOUR_R2_BUCKET_NAME>"

[[kv_namespaces]]
binding = "SESAP_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_KV_PREVIEW_ID>"

[vars]
ENVIRONMENT = "development"
SHOWCASE_URL = "http://localhost:8790"  # Update to production URL when deploying
# NEXT_DEV_URL is intentionally not set here. It is a local-dev-only variable
# that proxies non-API paths to the next dev server. In production the ASSETS
# binding serves the built next export. Add it to your local (gitignored)
# wrangler.toml if you need the dev proxy.

# Service bindings to other workers
[[services]]
binding = "PROCESSING_WORKER"
service = "sesap-processing"

[[services]]
binding = "INDEXING_WORKER"
service = "sesap-indexing"

# Queue producer for interview processing
[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "interview-processing"
