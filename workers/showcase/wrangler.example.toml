name = "sesap-showcase"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/*"]

[dev]
port = 8790
inspector_port = 9232

[[r2_buckets]]
binding = "SESAP_BUCKET"
bucket_name = "<YOUR_R2_BUCKET_NAME>"

[vars]
ENVIRONMENT = "development"
# In local dev, proxy non-API/non-build paths to the next dev server
# (set to empty/removed in production so ASSETS serves the built next export).
NEXT_DEV_URL = "http://127.0.0.1:3000"
