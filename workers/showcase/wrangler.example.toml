name = "sesap-showcase"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/assets/build/*", "/api/*"]

[dev]
port = 8790
inspector_port = 9232
persist_to = "../../.wrangler/state"

[[r2_buckets]]
binding = "SESAP_BUCKET"
bucket_name = "<YOUR_R2_BUCKET_NAME>"

[vars]
ENVIRONMENT = "development"
